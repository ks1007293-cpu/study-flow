<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<meta name="description" content="Study Flow - A modern Class 10 study planner for tasks, subjects, exams, revision, goals, calendar and focus sessions.">
<meta name="keywords" content="study planner, class 10 planner, student planner, study schedule, Study Flow">
<meta name="author" content="Study Flow">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#111427">

<title>Study Flow — Class 10 Study Planner</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#080a13;
    --bg2:#101322;
    --panel:#15192b;
    --panel2:#1a1f34;
    --border:#2a3048;
    --text:#f5f7ff;
    --muted:#9298ad;
    --purple:#7c6cff;
    --purple2:#a095ff;
    --cyan:#42d9ff;
    --green:#42d89a;
    --red:#ff6575;
    --yellow:#ffc857;
    --shadow:0 20px 60px rgba(0,0,0,.28);
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 75% -10%,rgba(124,108,255,.30),transparent 35%),
        radial-gradient(circle at 10% 20%,rgba(66,217,255,.08),transparent 25%),
        var(--bg);
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* INTRO */

#intro{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 40%,rgba(124,108,255,.25),transparent 35%),
        #080a13;
}

.intro-bg{
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:45px 45px;
}

.intro-box{
    position:relative;
    width:min(650px,92%);
    text-align:center;
    padding:45px 30px;
}

.logo{
    width:82px;
    height:82px;
    border-radius:25px;
    margin:0 auto 25px;
    display:grid;
    place-items:center;
    font-size:24px;
    font-weight:1000;
    background:linear-gradient(135deg,var(--purple),#b4aaff);
    box-shadow:0 25px 70px rgba(124,108,255,.35);
}

.intro-box h1{
    font-size:clamp(42px,8vw,75px);
    letter-spacing:-3px;
    margin-bottom:12px;
}

.intro-box h1 span{
    color:var(--purple2);
}

.intro-box p{
    color:var(--muted);
    font-size:17px;
    line-height:1.7;
    max-width:530px;
    margin:0 auto 30px;
}

.intro-features{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:30px;
}

.intro-features span{
    padding:8px 12px;
    background:#15192b;
    border:1px solid var(--border);
    border-radius:50px;
    color:#bfc3d5;
    font-size:12px;
}

/* APP */

#app{
    display:none;
}

.topbar{
    height:74px;
    position:sticky;
    top:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    background:rgba(8,10,19,.82);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.06);
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
    font-size:19px;
    font-weight:900;
}

.brand-logo{
    width:39px;
    height:39px;
    display:grid;
    place-items:center;
    border-radius:12px;
    background:linear-gradient(135deg,var(--purple),#aaa0ff);
    font-size:12px;
    font-weight:1000;
}

.top-actions{
    display:flex;
    gap:8px;
}

/* LAYOUT */

.layout{
    display:grid;
    grid-template-columns:220px minmax(0,1fr);
    min-height:calc(100vh - 74px);
}

.sidebar{
    position:sticky;
    top:74px;
    height:calc(100vh - 74px);
    padding:18px 12px;
    border-right:1px solid rgba(255,255,255,.06);
    background:rgba(8,10,19,.55);
}

.nav{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    border:0;
    background:transparent;
    color:#858ba2;
    padding:12px 13px;
    margin:2px 0;
    border-radius:11px;
    text-align:left;
    font-weight:800;
    transition:.2s;
}

.nav:hover{
    background:#171a2b;
    color:white;
}

.nav.active{
    background:linear-gradient(90deg,#24213d,#1b1d31);
    color:white;
    box-shadow:inset 3px 0 var(--purple);
}

.nav-icon{
    width:20px;
    text-align:center;
}

main{
    width:min(1450px,100%);
    margin:auto;
    padding:30px;
}

/* COMMON */

.page-head{
    display:flex;
    align-items:end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:23px;
}

.eyebrow{
    color:#a59cff;
    font-size:10px;
    letter-spacing:.18em;
    font-weight:1000;
}

.page-head h1{
    font-size:40px;
    letter-spacing:-1.5px;
    margin:5px 0;
}

.page-head p{
    color:var(--muted);
}

.btn{
    border:1px solid var(--border);
    background:#191d30;
    color:var(--text);
    padding:10px 14px;
    border-radius:11px;
    font-weight:850;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
    background:#22263b;
}

.btn.primary{
    border:0;
    background:linear-gradient(135deg,var(--purple),#9b8fff);
    box-shadow:0 10px 30px rgba(124,108,255,.25);
}

.btn.danger{
    color:#ff9aa4;
}

.card{
    background:linear-gradient(180deg,#181c30,#131625);
    border:1px solid rgba(255,255,255,.07);
    border-radius:20px;
    padding:19px;
    box-shadow:var(--shadow);
}

.card-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.card-title h2{
    font-size:17px;
}

.grid2{
    display:grid;
    grid-template-columns:1.35fr 1fr;
    gap:16px;
    margin-top:16px;
}

.grid3{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-top:16px;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
}

.stat small{
    color:var(--muted);
    display:block;
    font-size:11px;
}

.stat strong{
    display:block;
    font-size:27px;
    margin-top:6px;
}

/* TASKS */

.task{
    display:flex;
    gap:11px;
    align-items:flex-start;
    padding:13px 0;
    border-bottom:1px solid rgba(255,255,255,.06);
}

.task:last-child{
    border-bottom:0;
}

.check{
    width:23px;
    height:23px;
    border-radius:7px;
    border:2px solid #555c76;
    background:transparent;
    color:#07140f;
    font-weight:1000;
    flex:none;
}

.task.done .check{
    background:var(--green);
    border-color:var(--green);
}

.task-body{
    flex:1;
    min-width:0;
}

.task-title{
    font-weight:850;
}

.task.done .task-title{
    color:#777d91;
    text-decoration:line-through;
}

.task-meta{
    color:var(--muted);
    font-size:11px;
    margin-top:5px;
}

.task-overdue{
    border-left:3px solid var(--red);
    padding-left:9px;
}

.badge{
    display:inline-block;
    padding:4px 7px;
    margin-left:5px;
    border-radius:20px;
    font-size:9px;
    font-weight:950;
    background:#2b2849;
    color:#c1baff;
}

.badge.exam{
    background:#4b252c;
    color:#ff9da7;
}

.badge.revision{
    background:#163a39;
    color:#6ee4c5;
}

/* HERO */

.dashboard-hero{
    position:relative;
    overflow:hidden;
    padding:28px;
    margin-bottom:16px;
    border-radius:22px;
    background:
        radial-gradient(circle at 80% 20%,rgba(124,108,255,.28),transparent 35%),
        linear-gradient(135deg,#171a2d,#101321);
    border:1px solid rgba(255,255,255,.07);
}

.dashboard-hero h1{
    font-size:38px;
    margin:8px 0;
}

.dashboard-hero p{
    color:var(--muted);
}

/* GOAL */

.goal-circle{
    width:145px;
    height:145px;
    border-radius:50%;
    margin:18px auto;
    display:grid;
    place-items:center;
    position:relative;
    background:conic-gradient(var(--purple) 0 70%,#292e43 70% 100%);
}

.goal-circle:after{
    content:"";
    position:absolute;
    width:110px;
    height:110px;
    border-radius:50%;
    background:#171a2b;
}

.goal-circle strong{
    position:relative;
    z-index:2;
    font-size:28px;
}

/* CALENDAR */

.calendar-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    border:1px solid var(--border);
    border-radius:15px;
    overflow:hidden;
}

.weekday{
    text-align:center;
    padding:11px 5px;
    background:#101322;
    color:#777d94;
    font-size:10px;
    font-weight:950;
}

.day{
    min-height:115px;
    padding:8px;
    border-top:1px solid var(--border);
    border-right:1px solid var(--border);
    cursor:pointer;
    transition:.15s;
}

.day:hover{
    background:#1c2034;
}

.day.other{
    opacity:.35;
}

.day-number{
    display:flex;
    width:27px;
    height:27px;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    font-weight:900;
}

.day.today .day-number{
    background:var(--purple);
}

.event{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    padding:5px;
    margin-top:5px;
    border-radius:6px;
    background:#29264a;
    color:#c1baff;
    font-size:9px;
    font-weight:800;
}

.event.exam{
    background:#4b252c;
    color:#ff9da7;
}

/* FORMS */

.input,
select,
textarea{
    width:100%;
    border:1px solid var(--border);
    outline:none;
    background:#101322;
    color:var(--text);
    padding:11px 12px;
    border-radius:10px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    color:#8f94aa;
    font-size:11px;
    font-weight:900;
}

/* SUBJECTS */

.subject-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.subject-card{
    border-left:4px solid var(--purple);
}

.progress{
    height:8px;
    border-radius:20px;
    overflow:hidden;
    background:#292e43;
    margin:12px 0;
}

.progress span{
    display:block;
    height:100%;
    background:linear-gradient(90deg,var(--purple),var(--cyan));
}

/* FOCUS */

.focus-wrap{
    text-align:center;
}

.timer{
    width:260px;
    height:260px;
    margin:20px auto;
    display:grid;
    place-items:center;
    border-radius:50%;
    border:12px solid #292e43;
    background:#111424;
    box-shadow:0 0 70px rgba(124,108,255,.12);
}

.timer strong{
    font-size:47px;
}

/* COUNTDOWN */

.countdown{
    text-align:center;
    padding:20px;
}

.countdown strong{
    display:block;
    font-size:68px;
    letter-spacing:-3px;
}

.countdown span{
    color:var(--muted);
}

/* EMPTY */

.empty{
    text-align:center;
    padding:35px 15px;
    color:var(--muted);
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    z-index:500;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(8px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(650px,100%);
    max-height:90vh;
    overflow:auto;
    background:#181c30;
    border:1px solid rgba(255,255,255,.1);
    border-radius:22px;
    padding:22px;
    box-shadow:0 40px 100px #000b;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:18px;
}

/* TOAST */

.toast{
    position:fixed;
    z-index:1000;
    right:20px;
    bottom:20px;
    padding:13px 17px;
    border-radius:12px;
    background:#f4f3ff;
    color:#141526;
    font-weight:900;
    transform:translateY(30px);
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

/* MOBILE */

@media(max-width:950px){

    .layout{
        grid-template-columns:1fr;
    }

    .sidebar{
        position:fixed;
        z-index:200;
        bottom:0;
        top:auto;
        left:0;
        right:0;
        height:67px;
        display:flex;
        align-items:center;
        justify-content:space-around;
        padding:4px;
        background:#0c0f1c;
    }

    .nav{
        justify-content:center;
        flex-direction:column;
        gap:2px;
        padding:6px 4px;
        font-size:9px;
    }

    .nav-icon{
        font-size:15px;
    }

    main{
        padding-bottom:90px;
    }

    .stats{
        grid-template-columns:repeat(3,1fr);
    }

    .grid2{
        grid-template-columns:1fr;
    }
}

@media(max-width:650px){

    .topbar{
        padding:0 14px;
    }

    .top-actions .btn:not(.primary){
        display:none;
    }

    main{
        padding:20px 13px 90px;
    }

    .page-head{
        align-items:flex-start;
        flex-direction:column;
    }

    .page-head h1{
        font-size:31px;
    }

    .dashboard-hero h1{
        font-size:29px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .subject-grid,
    .grid3{
        grid-template-columns:1fr;
    }

    .form{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .day{
        min-height:90px;
        padding:5px;
    }

    .event{
        font-size:8px;
    }

    .weekday{
        font-size:8px;
    }

    .calendar{
        font-size:11px;
    }
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
    <div class="intro-bg"></div>

    <div class="intro-box">

        <div class="logo">SF</div>

        <h1>Study <span>Flow</span></h1>

        <p>
            Your personal Class 10 study command center.
            Plan your schedule, track revision, prepare for exams
            and stay consistent every day.
        </p>

        <div class="intro-features">
            <span>Tasks</span>
            <span>Calendar</span>
            <span>Goals</span>
            <span>Subjects</span>
            <span>Focus</span>
            <span>Revision</span>
            <span>Exams</span>
        </div>

        <button class="btn primary" style="font-size:16px;padding:13px 24px" onclick="startApp()">
            Open Study Flow →
        </button>

    </div>
</div>


<!-- APPLICATION -->
<div id="app">

    <header class="topbar">

        <div class="brand">
            <div class="brand-logo">SF</div>
            <span>Study Flow</span>
        </div>

        <div class="top-actions">
            <button class="btn" onclick="go('focus')">◷ Focus</button>
            <button class="btn primary" onclick="openTaskModal()">＋ Add schedule</button>
        </div>

    </header>


    <div class="layout">

        <aside class="sidebar">

            <button class="nav active" data-view="dashboard" onclick="go('dashboard')">
                <span class="nav-icon">⌂</span> Dashboard
            </button>

            <button class="nav" data-view="calendar" onclick="go('calendar')">
                <span class="nav-icon">▦</span> Calendar
            </button>

            <button class="nav" data-view="tasks" onclick="go('tasks')">
                <span class="nav-icon">✓</span> Tasks
            </button>

            <button class="nav" data-view="subjects" onclick="go('subjects')">
                <span class="nav-icon">▣</span> Subjects
            </button>

            <button class="nav" data-view="focus" onclick="go('focus')">
                <span class="nav-icon">◷</span> Focus
            </button>

            <button class="nav" data-view="goals" onclick="go('goals')">
                <span class="nav-icon">◎</span> Goals
            </button>

            <button class="nav" data-view="habits" onclick="go('habits')">
                <span class="nav-icon">♨</span> Habits
            </button>

            <button class="nav" data-view="notes" onclick="go('notes')">
                <span class="nav-icon">▤</span> Notes
            </button>

            <button class="nav" data-view="analytics" onclick="go('analytics')">
                <span class="nav-icon">⌁</span> Analytics
            </button>

            <button class="nav" data-view="settings" onclick="go('settings')">
                <span class="nav-icon">⚙</span> Settings
            </button>

        </aside>


        <main id="main"></main>

    </div>

</div>


<!-- MODAL -->
<div id="modal" class="modal"></div>

<div id="toast" class="toast"></div>


<script>

/* =========================================================
   STUDY FLOW — SINGLE FILE APPLICATION
   ========================================================= */

const STORAGE_KEY = "study-flow-single-v1";


const DEFAULT_DATA = {

    user:{
        name:"Student",
        board:"UP Board",
        target:95,
        examDate:"2027-02-15"
    },

    subjects:[
        "Mathematics",
        "Science",
        "English",
        "Hindi",
        "Social Science"
    ],

    tasks:[],

    goals:[],

    habits:[],

    notes:[],

    focus:[]

};


let DATA = loadData();

let currentView = "dashboard";

let calendarDate = new Date();

let timer = null;

let timerSeconds = 25 * 60;

let timerTotal = 25 * 60;


/* =========================================================
   STORAGE
   ========================================================= */

function loadData(){

    try{

        const saved = localStorage.getItem(STORAGE_KEY);

        if(saved){

            return {
                ...structuredClone(DEFAULT_DATA),
                ...JSON.parse(saved)
            };

        }

    }catch(error){

        console.log(error);

    }

    return structuredClone(DEFAULT_DATA);

}


function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(DATA)
    );

}


/* =========================================================
   HELPERS
   ========================================================= */

function id(){

    return Date.now().toString(36) +
        Math.random().toString(36).substring(2,8);

}


function today(){

    return new Date()
        .toISOString()
        .split("T")[0];

}


function formatDate(date){

    if(!date) return "";

    return new Date(date+"T12:00:00")
        .toLocaleDateString(
            undefined,
            {
                day:"numeric",
                month:"short",
                year:"numeric"
            }
        );

}


function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function toast(message){

    const element =
        document.getElementById("toast");

    element.textContent = message;

    element.classList.add("show");

    setTimeout(()=>{
        element.classList.remove("show");
    },1800);

}


/* =========================================================
   INTRO
   ========================================================= */

function startApp(){

    localStorage.setItem(
        "study-flow-intro",
        "seen"
    );

    document.getElementById("intro").style.display="none";

    document.getElementById("app").style.display="block";

    render();

}


if(localStorage.getItem("study-flow-intro")==="seen"){

    document.getElementById("intro").style.display="none";

    document.getElementById("app").style.display="block";

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function go(view){

    currentView=view;

    document
        .querySelectorAll(".nav")
        .forEach(button=>{

            button.classList.toggle(
                "active",
                button.dataset.view===view
            );

        });

    render();

}


function render(){

    const main =
        document.getElementById("main");

    if(!main) return;

    const pages={

        dashboard:renderDashboard,

        calendar:renderCalendarPage,

        tasks:renderTasksPage,

        subjects:renderSubjectsPage,

        focus:renderFocusPage,

        goals:renderGoalsPage,

        habits:renderHabitsPage,

        notes:renderNotesPage,

        analytics:renderAnalyticsPage,

        settings:renderSettingsPage

    };

    main.innerHTML = pages[currentView]();

    if(currentView==="calendar"){

        drawCalendar();

    }

    if(currentView==="tasks"){

        drawTaskList();

    }

}


/* =========================================================
   DASHBOARD
   ========================================================= */

function renderDashboard(){

    const todayTasks =
        DATA.tasks.filter(
            task=>task.date===today()
        );

    const completed =
        todayTasks.filter(
            task=>task.done
        ).length;

    const overdue =
        DATA.tasks.filter(
            task=>!task.done &&
                task.date<today()
        ).length;

    const focusMinutes =
        DATA.focus

function saveTask(taskId){

    const taskData={

        title:document.getElementById("taskTitle").value.trim(),

        date:document.getElementById("taskDate").value,

        time:document.getElementById("taskTime").value,

        duration:
            Number(
                document.getElementById("taskDuration").value
            ) || 30,

        type:
            document.getElementById("taskType").value,

        subject:
            document.getElementById("taskSubject").value,

        priority:
            document.getElementById("taskPriority").value,

        notes:
            document.getElementById("taskNotes").value

    };


    if(!taskData.title){

        toast("Please enter a task title.");

        return;

    }


    if(taskId){

        const task =
            DATA.tasks.find(
                x=>x.id===taskId
            );

        if(task){

            Object.assign(
                task,
                taskData
            );

        }

    }else{

        DATA.tasks.push({

            id:id(),

            ...taskData,

            done:false

        });

    }


    saveData();

    closeModal();

    toast("Schedule saved ✓");

    render();

}


function toggleTask(taskId){

    const task =
        DATA.tasks.find(
            x=>x.id===taskId
        );

    if(!task) return;

    task.done=!task.done;

    saveData();

    toast(
        task.done
        ? "Task completed ✓"
        : "Task marked pending"
    );

    render();

}


function deleteTask(taskId){

    DATA.tasks =
        DATA.tasks.filter(
            x=>x.id!==taskId
        );

    saveData();

    toast("Task deleted");

    render();

}


function closeModal(){

    document
        .getElementById("modal")
        .classList.remove("show");

}

function drawTaskList(){

    const container =
        document.getElementById("taskList");

    if(!container) return;


    const search =
        (
            document.getElementById("taskSearch")
            ?.value ||
            ""
        ).toLowerCase();


    const filter =
        document.getElementById("taskFilter")
        ?.value ||
        "all";


    let tasks =
        DATA.tasks.filter(
            task=>
            (
                task.title+
                " "+
                task.subject+
                " "+
                task.type+
                " "+
                task.notes
            )
            .toLowerCase()
            .includes(search)
        );


    tasks =
        tasks.filter(task=>{

            if(filter==="today")
                return task.date===today();

            if(filter==="overdue")
                return !task.done &&
                    task.date<today();

            if(filter==="upcoming")
                return !task.done &&
                    task.date>today();

            if(filter==="completed")
                return task.done;

            return true;

        });


    tasks.sort(
        (a,b)=>
            a.date.localeCompare(b.date)
    );


    container.innerHTML =
        tasks.length
        ?
        tasks.map(taskHTML).join("")
        :
        `
        <div class="empty">
            No tasks found.
        </div>
        `;

}

function drawCalendar(){

    const area =
        document.getElementById(
            "calendarArea"
        );

    if(!area) return;


    const year =
        calendarDate.getFullYear();

    const month =
        calendarDate.getMonth();


    const first =
        new Date(
            year,
            month,
            1
        );


    const startDay =
        first.getDay();


    const days =
        new Date(
            year,
            month+1,
            0
        ).getDate();


    const monthName =
        calendarDate.toLocaleDateString(
            undefined,
            {
                month:"long",
                year:"numeric"
            }
        );


    let html=`

    <div class="calendar-head">

        <div>

            <button
                class="btn"
                onclick="changeMonth(-1)"
            >
                ‹
            </button>

            <button
                class="btn"
                onclick="calendarDate=new Date();drawCalendar()"
            >
                Today
            </button>

            <button
                class="btn"
                onclick="changeMonth(1)"
            >
                ›
            </button>

        </div>

        <h2>${monthName}</h2>

        <div></div>

    </div>


    <div class="calendar">

        ${
            ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]
            .map(
                day=>
                `<div class="weekday">${day}</div>`
            )
            .join("")
        }

    `;


    const previousDays =
        new Date(
            year,
            month,
            0
        ).getDate();


    for(
        let i=0;
        i<startDay;
        i++
    ){

        const number =
            previousDays-startDay+i+1;

        html+=`

        <div class="day other">

            <div class="day-number">
                ${number}
            </div>

        </div>

        `;

    }


    for(
        let day=1;
        day<=days;
        day++
    ){

        const dateString =
            `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;


        const events =
            DATA.tasks.filter(
                task=>task.date===dateString
            );


        html+=`

        <div
            class="day ${dateString===today()?"today":""}"
            onclick="openTaskModal(null,'${dateString}')"
        >

            <div class="day-number">
                ${day}
            </div>

            ${
                events
                .slice(0,4)
                .map(
                    event=>
                    `
                    <div
                        class="event ${event.type==="Exam"?"exam":""}"
                        onclick="event.stopPropagation();openTaskModal('${event.id}')"
                    >
                        ${escapeHTML(event.title)}
                    </div>
                    `
                )
                .join("")
            }

            ${
                events.length>4
                ?
                `<div class="task-meta">
                    +${events.length-4} more
                </div>`
                :
                ""
            }

        </div>

        `;

    }


    const totalCells =
        startDay+days;

    const remaining =
        (7-(totalCells%7))%7;


    for(
        let i=1;
        i<=remaining;
        i++
    ){

        html+=`

        <div class="day other">

            <div class="day-number">
                ${i}
            </div>

        </div>

        `;

    }


    html+=`</div>`;

    area.innerHTML=html;

}


function changeMonth(amount){

    calendarDate.setMonth(
        calendarDate.getMonth()+amount
    );

    drawCalendar();

}

function formatTimer(seconds){

    const minutes =
        Math.floor(seconds/60);

    const secs =
        seconds%60;

    return `
        ${String(minutes).padStart(2,"0")}:
        ${String(secs).padStart(2,"0")}
    `;

}


function setTimerMinutes(minutes){

    clearInterval(timer);

    timer=null;

    timerSeconds=minutes*60;

    timerTotal=timerSeconds;

    render();

}


function toggleTimer(){

    if(timer){

        clearInterval(timer);

        timer=null;

        document.getElementById(
            "timerButton"
        ).textContent="Resume";

        return;

    }


    timer=setInterval(()=>{

        timerSeconds--;

        const display =
            document.getElementById(
                "timerDisplay"
            );

        if(display){

            display.textContent =
                formatTimer(timerSeconds);

        }


        if(timerSeconds<=0){

            clearInterval(timer);

            timer=null;


            DATA.focus.push({

                date:today(),

                minutes:
                    Math.round(
                        timerTotal/60
                    )

            });


            saveData();

            toast(
                "Focus session completed ✓"
            );

            render();

        }

    },1000);


    document.getElementById(
        "timerButton"
    ).textContent="Pause";

}

}


function openGoalModal(){

    <div class="modal-box">

        <div class="modal-head">

            <h2>Set study goal</h2>

            <button
                class="btn"

                <label>
                    Target percentage

function saveGoal(){

    const title =
        document
        .getElementById("goalTitle")
        .value.trim();


    const target =
        Number(
            document
            .getElementById("goalTarget")
            .value
        );


    if(!title || !target){

        toast("Enter a valid goal.");

        return;

    }


    DATA.goals.push({

        id:id(),

        title,

        target,

        current:0

    });


    DATA.user.target=target;

    saveData();

    closeModal();

    toast("Goal saved ✓");

    render();

}


function increaseGoal(goalId){

    const goal =
        DATA.goals.find(
            x=>x.id===goalId
        );

    if(!goal) return;

    goal.current =
        Math.min(
            goal.target,
            goal.current+1
        );

    saveData();

    render();

}

function renderHabitsPage(){

    return `

    <div class="page-head">

        <div>

            </div>

            <p>

            onclick="addHabit()"
        >

        </button>

    </div>


    <div class="grid3">

        ${
            DATA.habits.length
            ?
            DATA.habits
            .map(habit=>{

                const checked =
                    habit.days?.includes(today());


                const streak =
                    calculateStreak(
                        habit.days||[]
                    );


                return `

                <div class="card">

                    <div class="eyebrow">
                        HABIT
                    </div>

                    <h2 style="margin-top:8px">
                        ${escapeHTML(habit.name)}
                    </h2>

                        color:var(--muted);
                        margin:8px 0 16px;
                    ">
                        Current streak:
                        <b>${streak} days</b>
                    </p>

                    <button
                        class="btn ${checked?"":"primary"}"
                        onclick="checkHabit('${habit.id}')"
                    >
                        ${checked?"✓ Done today":"Check in today"}
                    </button>

                </div>

                `;

            })
            .join("")
            :
            `
            <div class="card empty">

                <h3>
                    No habits yet.
                </h3>

                <p style="margin-top:7px">
                    Add revision, reading,
                    daily maths or another routine.
                </p>

            </div>
            `
        }

    </div>

    `;

}


function addHabit(){

    const name =
        prompt(
            "Habit name:"
        );


    if(!name?.trim())
        return;


    DATA.habits.push({

        id:id(),

        name:name.trim(),

        days:[]

    });


    saveData();

    toast("Habit added ✓");

    render();

}


function checkHabit(habitId){

    const habit =
        DATA.habits.find(
            x=>x.id===habitId
        );


    if(!habit) return;


    habit.days =
        habit.days || [];


    if(!habit.days.includes(today())){

        habit.days.push(today());

        saveData();

        toast("Habit checked ✓");

    }


    render();

}


function calculateStreak(days){

    if(!days.length)
        return 0;


    const set =
        new Set(days);


    let count=0;

    const date =
        new Date();


    while(
        set.has(
            date.toISOString().split("T")[0]
        )
    ){

        count++;

        date.setDate(
            date.getDate()-1
        );

    }


    return count;

}

/* =========================================================
   BACKUP
   ========================================================= */

function exportData(){

    const blob =
        new Blob(
            [
                JSON.stringify(
                    DATA,
                    null,
                    2
                )
            ],
            {
                type:"application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href=url;

    a.download=
        "study-flow-backup.json";

    a.click();


    URL.revokeObjectURL(url);

}


function importData(event){

    const file =
        event.target.files[0];


    if(!file) return;


    const reader =
        new FileReader();


    reader.onload=()=>{

        try{

            const imported =
                JSON.parse(
                    reader.result
                );


            if(
                !imported.tasks ||
                !imported.subjects
            ){

                throw new Error(
                    "Invalid backup"
                );

            }


            DATA={
                ...structuredClone(DEFAULT_DATA),
                ...imported
            };


            saveData();

            toast("Backup imported ✓");

            render();

        }catch(error){

            toast(
                "Invalid backup file."
            );

        }

    };


    reader.readAsText(file);

}

function resetPlanner(){

    const confirmed =
        confirm(
            "This will delete ALL Study Flow data from this browser. Continue?"
        );


    if(!confirmed)
        return;


    localStorage.removeItem(
        STORAGE_KEY
    );


    DATA =
        structuredClone(
            DEFAULT_DATA
        );


    toast(
        "Planner reset."
    );


    render();

}
